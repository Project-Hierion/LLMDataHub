name: Repo Automation Status

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml requests

    - name: Run unit tests
      run: |
        python repo-maintenance-automation/tests/test_pipeline.py

    - name: Run validator
      run: |
        python repo-maintenance-automation/validate-autonomy.py

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: repo-automation-report-${{ github.run_id }}
        path: repo-maintenance-automation/logs/
        if-no-files-found: warn
