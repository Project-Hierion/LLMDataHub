name: Repo Automation Status

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml
    
    - name: Run validator
      run: |
        python repo-maintenance-automation/validate-autonomy.py
    
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: repo-automation-report
        path: logs/
