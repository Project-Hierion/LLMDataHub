name: Weekly Harvest

on:
  schedule:
    - cron: '0 5 * * 4'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml requests
    
    - name: Run harvest
      run: |
        python repo-maintenance-automation/harvest.py --pr
        echo "PR_BODY<<EOF" >> $GITHUB_ENV
        cat logs/pr_body.md >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
    
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v6
      with:
        title: "🌱 Weekly Harvest: Automated Resource Discovery"
        body: ${{ env.PR_BODY }}
        branch: auto/harvest-${{ github.run_number }}
        delete-branch: true
        labels: |
          harvest
          automated-pr
    
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: harvest-report
        path: logs/
