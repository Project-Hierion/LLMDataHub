name: Weekly Harvest

on:
  schedule:
    # 5:00 AM UTC every Thursday (approx midnight CT)
    - cron: '0 5 * * 4'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml requests
    
    - name: Run harvest
      run: |
        python repo-maintenance-automation/harvest.py
    
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: harvest-report
        path: logs/
