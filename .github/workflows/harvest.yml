name: Weekly Harvest

on:
  schedule:
    - cron: '0 5 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml requests

    - name: Run harvest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python repo-maintenance-automation/harvest.py --pr

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        title: "🌱 Weekly Harvest: Automated Resource Discovery"
        body-path: repo-maintenance-automation/logs/pr_body.md
        branch: auto/harvest-${{ github.run_number }}
        delete-branch: true
        labels: harvest, automated-pr
        commit-message: "Auto-harvest: new resources"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: harvest-report-${{ github.run_id }}
        path: repo-maintenance-automation/logs/
        if-no-files-found: warn
